<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>えきタイマー</title>
<meta name="description" content="時間を「分」ではなく「駅」ではかるタイマー。山手線や大阪環状線の区間を選ぶと、駅ごとに音とアナウンスが流れます。">
<meta name="theme-color" content="#0e141b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚃</text></svg>">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header>
  <h1>🚃 えきタイマー</h1>
</header>

<main>
  <section id="setup" class="setup">
    <div class="card">
      <div class="field">
        <div class="seg" id="lineSeg"></div>
      </div>
      <div class="field">
        <svg id="pick" role="img" aria-label="駅を選ぶ路線図（1回目のタップで乗る駅、2回目で降りる駅）"></svg>
      </div>
      <div class="opts" role="group" aria-label="オプション">
        <button type="button" class="tg sfx" id="optSfx" data-mode="sound">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <g class="ib"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></g>
            <rect class="ip" width="8" height="14" x="8" y="5" rx="1"/>
            <g class="iz"><path d="m2 8 2 2-2 2 2 2-2 2"/><path d="m22 8-2 2 2 2-2 2 2 2"/></g>
            <path class="slash" d="M4 4l16 16"/>
          </svg>
          <span class="sr" id="sfxLabel">効果音</span>
        </button>
        <label class="tg" title="アナウンス">
          <input type="checkbox" id="optVoice" checked>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/><path class="slash" d="M4 4l16 16"/></svg>
          <span class="sr">アナウンス</span>
        </label>
        <label class="tg" title="走行音">
          <input type="checkbox" id="optRumble" checked>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/><path class="slash" d="M4 4l16 16"/></svg>
          <span class="sr">走行音</span>
        </label>
        <label class="tg" title="画面をスリープさせない">
          <input type="checkbox" id="optAwake" checked>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/><path class="slash" d="M4 4l16 16"/></svg>
          <span class="sr">画面をスリープさせない</span>
        </label>
        <button type="button" class="tg spd" id="optSpeed" title="速さ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 19l9-7-9-7v14zM2 19l9-7-9-7v14z"/></svg>
          <b id="spdBadge"></b>
          <span class="sr" id="spdLabel">速さ：通常</span>
        </button>
      </div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <button type="button" class="go" id="btnGo">出発進行</button>
    </div>
  </section>

  <section id="ride" class="ride" hidden>
    <div class="lcd">
      <div class="lcd-top"><span id="lcdLine"></span><span id="lcdDest"></span></div>
      <div class="lcd-main">
        <div class="lcd-label" id="lcdLabel">次は</div>
        <div class="lcd-name" id="lcdName"></div>
        <div class="lcd-kana" id="lcdKana"></div>
      </div>
      <div class="progress"><div id="bar"></div></div>
    </div>
    <div class="mapwrap"><svg id="map" role="img" aria-label="路線図"></svg></div>
    <div class="ctrl">
      <button type="button" id="btnPause">一時停止</button>
      <button type="button" id="btnStop">降りる</button>
    </div>
  </section>
</main>
</body>
</html>
